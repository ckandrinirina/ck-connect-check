# Builds the universal macOS app on a pushed `v*` tag and publishes it as a
# GitHub Release. The asset names are fixed so the Pages site can link to
# `releases/latest/download/<name>` without changing per version.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        run: node scripts/check-release-tag.mjs "$GITHUB_REF_NAME"

      - run: npm ci

      - run: npm test

      - run: npm run lint

      - run: npm run make

      - name: Rename the artifacts to their fixed names
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg=(out/make/*.dmg)
          zip=(out/make/zip/darwin/universal/*.zip)
          # Exactly one of each, or the upload would pick an arbitrary file.
          test "${#dmg[@]}" -eq 1
          test "${#zip[@]}" -eq 1
          mkdir -p release
          mv "${dmg[0]}" release/ck-connect-check-mac.dmg
          mv "${zip[0]}" release/ck-connect-check-mac.zip

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/ck-connect-check-mac.dmg
          release/ck-connect-check-mac.zip
          --title "$GITHUB_REF_NAME"
          --generate-notes
