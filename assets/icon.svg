<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    The app's mark: the panel's own dial, with the panel's own signal bars set
    inside it. Drawn on the 1024 canvas macOS asks for, with the artwork inset
    to 824 and rounded to 185 — the proportions that make it sit at the same
    visual size as every other icon in the Dock.

    Nothing here is a raster and nothing is a font: the whole mark is geometry,
    so 16px and 1024px are the same drawing at two scales.
  -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D9BFF" />
      <stop offset="0.45" stop-color="#0A84FF" />
      <stop offset="1" stop-color="#2C3FD4" />
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#field)" />

  <!--
    Rotated so the sweep starts at twelve o'clock, the way the panel's dial
    does. `pathLength="100"` restates the circumference as 100 units, so the
    dash below is a percentage rather than a number derived from the radius.
  -->
  <g transform="rotate(-90 512 512)">
    <circle
      cx="512"
      cy="512"
      r="256"
      fill="none"
      stroke="#FFFFFF"
      stroke-opacity="0.25"
      stroke-width="76"
    />
    <circle
      cx="512"
      cy="512"
      r="256"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="76"
      stroke-linecap="butt"
      pathLength="100"
      stroke-dasharray="68 100"
    />
  </g>

  <!--
    Four bars of ascending height on a shared foot, so the rise reads as a
    rise. They sit inside the ring's 218-unit clear radius with room to spare.
  -->
  <g fill="#FFFFFF">
    <rect x="366" y="542" width="52" height="66" rx="12" />
    <rect x="446" y="500" width="52" height="108" rx="12" />
    <rect x="526" y="458" width="52" height="150" rx="12" />
    <rect x="606" y="416" width="52" height="192" rx="12" />
  </g>
</svg>
