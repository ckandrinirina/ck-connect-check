<!doctype html>
<html lang="en" data-devices-state="offline">
  <head>
    <meta charset="utf-8" />
    <!-- The same policy as the panel: nothing remote, no chart library, no font. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src file: 'self'; script-src file: 'self'"
    />
    <title>Connected devices</title>
    <!--
      The build copies this page into `dist/renderer/`, beside the script `tsc`
      emits there, and that copy is what the app loads. Every path here is
      therefore relative to the page itself — a walk up out of `dist/` would
      leave the bundle, which ships `dist/` and nothing else.
    -->
    <script type="module" src="./devices.js"></script>
  </head>
  <body>
    <h1>Connected devices</h1>
    <!--
      The shell of the list. The columns are stated here because they never
      change; the rows are written by `devices.ts` and arrive from the router.

      There is no medium column and no active dot: `host-list` sends neither,
      and it reports only the hosts associated right now — see T-62.
    -->
    <table class="devices" data-devices-table hidden>
      <thead>
        <tr>
          <th scope="col">Device</th>
          <th scope="col">IP address</th>
          <th scope="col">MAC address</th>
          <th scope="col">Network</th>
          <th scope="col">Connected for</th>
          <!--
            What the router's MAC filter is already doing about this device. A
            word rather than a colour: the page is unstyled, and a tint would
            still say nothing in greyscale once it is not.
          -->
          <th scope="col">Access</th>
        </tr>
      </thead>
      <tbody data-devices></tbody>
    </table>
    <!--
      The two ways of having no rows, which are not the same answer. The router
      saying nothing is connected is a fact about the household; the router not
      answering is a fact about the router, and the app runs unattended, so it
      is a state on the page rather than a dialog.
    -->
    <p class="notice" data-devices-empty hidden>
      No device is connected to the router.
    </p>
    <p class="notice" data-devices-offline hidden>Waiting for the router</p>
  </body>
</html>
