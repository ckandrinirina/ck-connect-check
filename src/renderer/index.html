<!doctype html>
<html lang="en" data-stale="true" data-limit="unset">
  <head>
    <meta charset="utf-8" />
    <!-- No remote anything: the panel only ever renders strings handed to it by the main process. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src file: 'self'; script-src file: 'self'"
    />
    <title>Data usage</title>
    <link rel="stylesheet" href="./popover.css" />
    <!--
      The build copies this page and its stylesheet into `dist/renderer/`, beside
      the script `tsc` emits there, and that copy is what the app loads. Every
      path here is therefore relative to the page itself — a walk up out of
      `dist/` would leave the bundle, which ships `dist/` and nothing else.
    -->
    <script type="module" src="./popover.js"></script>
  </head>
  <body>
    <header class="header">
      <div class="network">
        <span class="carrier" data-field="carrier">—</span>
        <span class="signal" title="Signal bars">
          <span class="signal-icon" aria-hidden="true"></span>
          <span data-field="signal">—</span>
        </span>
      </div>
      <span class="freshness" data-field="freshness"
        >Waiting for the router</span
      >
    </header>

    <section class="usage">
      <!--
        The ring itself is built by `popover.ts`: its geometry comes from the
        model, and an SVG whose only job is to be redrawn belongs where the
        redrawing happens. The percentage stays here as ordinary text so the
        page reads the same as every other field.
      -->
      <div class="dial" data-dial role="img" aria-label="No usage read yet">
        <span class="dial-value" data-field="percent">—</span>
      </div>

      <div class="usage-figures">
        <span class="total" data-field="monthTotal">—</span>
        <span class="caption">used this month</span>
        <p class="prompt" data-field="prompt"></p>

        <!--
          The one figure the carrier never states, so it has to be typed. It
          stays on the panel rather than appearing only when unset: a plan that
          changes has to be correctable. The value is filled from the model and
          the refusal is worded in the main process — this is a field, not a
          validator.
        -->
        <form class="plan-limit" data-plan-limit>
          <label class="plan-limit-label" for="plan-limit">Plan</label>
          <input
            id="plan-limit"
            class="plan-limit-input"
            data-plan-limit-input
            type="text"
            inputmode="decimal"
            autocomplete="off"
            spellcheck="false"
            placeholder="150"
          />
          <span class="plan-limit-unit" data-field="planLimitUnit">Go</span>
          <button class="plan-limit-submit" type="submit">Set</button>
        </form>
        <p
          class="plan-limit-error"
          data-field="planLimitError"
          role="status"
        ></p>
      </div>
    </section>

    <!--
      The carrier's own figure, carried forward from the last sync. It is a
      different question from the dial above it — that is a share of the plan,
      this is the exact volume the carrier said was left — so it gets its own
      strip rather than another number in the grid.
    -->
    <section class="allowance">
      <div class="allowance-figure">
        <span class="allowance-remaining" data-field="allowanceRemaining"
          >—</span
        >
        <span class="caption">left with the carrier</span>
      </div>
      <div class="allowance-meta">
        <span class="allowance-plan" data-field="allowancePlan">—</span>
        <span class="allowance-synced" data-field="allowanceSynced">—</span>
      </div>
      <!--
        The re-sync marker. It is text, never a colour on its own: a figure that
        can no longer be trusted has to say so out loud.
      -->
      <p class="allowance-note" data-field="allowanceNote"></p>
    </section>

    <!--
      Live throughput, as a shape rather than a figure. Each row is a label, the
      sparkline the last few minutes drew, and the current rate as text. The two
      SVGs are built by `popover.ts` for the same reason the dial's is: they
      exist to be redrawn, so they belong where the redrawing happens.
    -->
    <section class="rates">
      <div class="rate">
        <span class="rate-label">Down</span>
        <span class="spark" data-spark="download" data-empty="true"></span>
        <span class="rate-value" data-field="downloadRate">—</span>
      </div>
      <div class="rate">
        <span class="rate-label">Up</span>
        <span class="spark" data-spark="upload" data-empty="true"></span>
        <span class="rate-value" data-field="uploadRate">—</span>
      </div>
    </section>

    <dl class="stats">
      <div class="stat">
        <dt>Downloaded</dt>
        <dd data-field="monthDownload">—</dd>
      </div>
      <div class="stat">
        <dt>Uploaded</dt>
        <dd data-field="monthUpload">—</dd>
      </div>
      <div class="stat">
        <dt>Devices</dt>
        <dd data-field="connectedDevices">—</dd>
      </div>
      <div class="stat">
        <dt>Expires</dt>
        <dd data-field="allowanceExpires">—</dd>
      </div>
      <div class="stat">
        <dt>Valid for</dt>
        <dd data-field="allowanceDaysLeft">—</dd>
      </div>
    </dl>

    <!--
      The one control on the panel. USSD takes tens of seconds and holds
      carrier-side state, so it is only ever driven from here — never by the
      poll timer. The status line is a live region: the step names arriving in
      it are the proof the panel has not frozen.
    -->
    <footer class="sync">
      <button
        class="sync-button"
        type="button"
        data-sync
        data-attention="false"
        aria-label="Sync the allowance with the carrier"
      >
        Sync
      </button>
      <p class="sync-status" data-field="syncStatus" role="status"></p>
    </footer>

    <!--
      Shown only when nothing is stored: the password goes straight to the
      Keychain through the main process, and is never written to the config.
    -->
    <form class="password-prompt" data-password-prompt hidden>
      <label class="password-label" for="router-username">Router user</label>
      <input
        id="router-username"
        class="password-input"
        data-password-username
        type="text"
        value="admin"
        autocomplete="username"
        spellcheck="false"
      />
      <label class="password-label" for="router-password">Password</label>
      <input
        id="router-password"
        class="password-input"
        data-password-password
        type="password"
        autocomplete="current-password"
      />
      <button class="password-submit" type="submit">Save and sync</button>
    </form>
  </body>
</html>
